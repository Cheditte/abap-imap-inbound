name: Bug report / Hata bildirimi
description: Something does not work during setup or processing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, real mail content, customer data or internal host names.
        Parola, gerçek mail içeriği, müşteri verisi veya iç sunucu adı eklemeyin.
        Security issues: use **Security → Report a vulnerability** instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: abap-imap-inbound release, for example v0.9.2
    validations:
      required: true
  - type: input
    id: sap
    attributes:
      label: SAP release and SAP_BASIS
      description: For example S/4HANA 2023 / SAP_BASIS 758, or ECC 6.0 EHP7 / 740. Unicode or non-Unicode.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: SAP host operating system
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: PowerShell and curl versions
      description: Output of `$PSVersionTable.PSVersion` and the first line of `curl --version` on the SAP host.
  - type: dropdown
    id: step
    attributes:
      label: Where did it stop?
      options:
        - Server setup (setup-server)
        - Installer (ZCHE_IMAP_INSTALL)
        - Authorization / role
        - Profile and connection test (ZCHE_IMAP_CONFIG)
        - List only (ZCHE_IMAP_INBOUND)
        - Processing / handler (ZCHE_IMAP_INBOUND)
        - Monitor (ZCHE_IMAP_MONITOR)
        - Background job
        - Other
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Error message and what you did
      description: The exact message (for example `ERR CFG ...` or `SXPG1`) and the steps before it.
    validations:
      required: true
