name: IMAP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: pwsh -NoProfile -File installer/build.ps1 -Check
      - run: npm run test:gate
      - run: npm run check
      - run: pwsh -NoProfile -File test/run-tests.ps1 -Shell pwsh
      - if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/run-tests.ps1 -Shell powershell.exe
  greenmail:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      greenmail:
        image: greenmail/standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
        env:
          GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0'
        ports:
          - 3993:3993
          - 3025:3025
          - 8080:8080
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Wait for disposable test server
        shell: pwsh
        run: |
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            try { Invoke-WebRequest http://127.0.0.1:8080/api/user -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep -Seconds 2 }
          }
      - run: pwsh -NoProfile -File test/run-imap-tests.ps1 -Shell pwsh
