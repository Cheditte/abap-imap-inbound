<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">Four steps inside SAP.</title>
  <desc id="desc">Four steps inside SAP.. ABAP IMAP Inbound.</desc>
  <rect x="0" y="0" width="1440" height="470" rx="0" fill="#231A28" />
  <rect x="56" y="44" width="30" height="4" rx="2" fill="#D4E86A" />
  <text x="100" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">STEP BY STEP</text>
  <text x="56" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#F4F0E8">Four steps inside SAP.</text>
  <text x="56" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#BDB4C2">Follow these steps if you can create and run a report in SE38.</text>
  <rect x="56.0" y="210" width="314.0" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="78.0" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">01</text>
  <text x="78.0" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Create the report</text>
  <text x="78.0" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">SE38 / INSTALL</text>
  <rect x="394.0" y="210" width="314.0" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="416.0" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">02</text>
  <text x="416.0" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Run the installer</text>
  <text x="416.0" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">SAP objects</text>
  <rect x="732.0" y="210" width="314.0" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="754.0" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">03</text>
  <text x="754.0" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Check permissions</text>
  <text x="754.0" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">Tables, commands, files</text>
  <rect x="1070.0" y="210" width="314.0" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="1092.0" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">04</text>
  <text x="1092.0" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Save the profile</text>
  <text x="1092.0" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">CONFIG / connection</text>
  <text x="56" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#BDB4C2">Additional per-profile authorization is optional; see the security guide.</text>
  <text x="1234" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">ABAP / IMAP</text>
