<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title"><title id="title">Hedefinizden başlayın</title><rect width="720" height="430" rx="18" fill="#122739"/><text x="32" y="49" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f4f8fa">Hedefinizden başlayın</text><rect x="24" y="76" width="672" height="94" rx="12" fill="#f4f8fa"/><circle cx="65" cy="122" r="23" fill="#d8f2eb"/><text x="65" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b62">A</text><text x="106" y="112" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183c53">Bağlantıyı ve listeyi görün</text><text x="106" y="142" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#425f70">Yalnız listeleme; içerik indirilmez.</text><rect x="24" y="186" width="672" height="94" rx="12" fill="#f4f8fa"/><circle cx="65" cy="232" r="23" fill="#d8f2eb"/><text x="65" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b62">B</text><text x="106" y="222" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183c53">İlk maili ve eki açın</text><text x="106" y="252" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#425f70">Normal işleme; başarılı mail taşınır.</text><rect x="24" y="296" width="672" height="94" rx="12" fill="#f4f8fa"/><circle cx="65" cy="342" r="23" fill="#d8f2eb"/><text x="65" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b62">C</text><text x="106" y="332" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183c53">Otomatik çalıştırın</text><text x="106" y="362" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#425f70">Varyant ve job; sonuçları izleyin.</text></svg>
