<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630" role="img" aria-labelledby="title desc">
  <title id="title">İlk kullanım yolları</title>
  <desc id="desc">İlk kullanım yolları. ABAP IMAP Inbound.</desc>
  <rect x="0" y="0" width="1440" height="630" rx="0" fill="#231A28" />
  <rect x="56" y="44" width="30" height="4" rx="2" fill="#D4E86A" />
  <text x="100" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">İLK KULLANIM</text>
  <text x="56" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#F4F0E8">Hedefini seç. Sırayla ilerle.</text>
  <text x="56" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#BDB4C2">Bağlantıdan ilk eke, oradan düzenli çalıştırmaya.</text>
  <rect x="56" y="213" width="416" height="314" rx="18" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <rect x="80" y="237" width="44" height="44" rx="10" fill="#D4E86A" />
  <text x="91" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#231A28">A</text>
  <text x="80" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F0E8">Bağlantıyı</text>
  <text x="80" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F0E8">kontrol et</text>
  <text x="80" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#D4E86A">List only</text>
  <polyline points="80,433 448,433" fill="none" stroke="#76667D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="80" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#BDB4C2">İleti numaralarını listeleyin.</text>
  <text x="80" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#BDB4C2">İçerik indirilmez, mail taşınmaz.</text>
  <rect x="512" y="213" width="416" height="314" rx="18" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <rect x="536" y="237" width="44" height="44" rx="10" fill="#D4E86A" />
  <text x="547" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#231A28">B</text>
  <text x="536" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F0E8">Maili ve</text>
  <text x="536" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F0E8">ekini aç</text>
  <text x="536" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#D4E86A">INBOUND → MONITOR</text>
  <polyline points="536,433 904,433" fill="none" stroke="#76667D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="536" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#BDB4C2">Bir test mailini işleyin.</text>
  <text x="536" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#BDB4C2">Gövdeyi ve eki SAP’de açın.</text>
  <rect x="968" y="213" width="416" height="314" rx="18" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <rect x="992" y="237" width="44" height="44" rx="10" fill="#D4E86A" />
  <text x="1003" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#231A28">C</text>
  <text x="992" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F0E8">Düzenli</text>
  <text x="992" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#F4F0E8">çalıştır</text>
  <text x="992" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#D4E86A">SM36 → SM37</text>
  <polyline points="992,433 1360,433" fill="none" stroke="#76667D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="992" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#BDB4C2">Varyant ve job tanımlayın.</text>
  <text x="992" y="499" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#BDB4C2">İş günlüğünü ve sonucu okuyun.</text>
  <text x="56" y="603" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#BDB4C2">Önce kurulumu tamamlayın. Ayrı bir deneme posta kutusuyla başlayın.</text>
  <text x="1234" y="603" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">ABAP / IMAP</text>
  <g transform="translate(379.0 225.0) scale(.8)">
    <rect x="5" y="7" width="62" height="46" rx="5" fill="#F4F0E8" />
    <path d="M17 19 L29 30 L17 41 M36 41 H53" fill="none" stroke="#231A28" stroke-width="4" />
  </g>
  <g transform="translate(835.0 225.0) scale(.8)">
    <path d="M4 14 L57 14 L68 6 L15 6 Z" fill="#BDB4C2" />
    <path d="M57 14 L68 6 L68 43 L57 51 Z" fill="#76667D" />
    <path d="M4 14 H57 V51 H4 Z M4 14 L30 34 L57 14" fill="#F4F0E8" stroke="#231A28" stroke-width="3" />
  </g>
  <g transform="translate(1291.0 225.0) scale(.8)">
    <rect x="8" y="10" width="53" height="45" rx="5" fill="#F4F0E8" />
    <path d="M8 24 H61 M20 4 V16 M49 4 V16" stroke="#76667D" stroke-width="4" />
    <circle cx="45" cy="44" r="14" fill="#D4E86A" stroke="#231A28" stroke-width="2" />
    <path d="M45 35 V44 L51 48" fill="none" stroke="#231A28" stroke-width="3" />
  </g>
</svg>