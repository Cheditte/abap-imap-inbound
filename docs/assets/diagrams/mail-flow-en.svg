<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img" aria-labelledby="title"><title id="title">mail-flow (en)</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#456b96"/></marker></defs><rect width="720" height="476" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#183c68"><rect x="55" y="20" width="610" height="116" rx="12" fill="#edf4fc" stroke="#6e94bc" stroke-width="2"/><text x="360" y="58.5" font-size="24" font-weight="700">Source mail folder</text><text x="360" y="93.5" font-size="20" fill="#405b78">Default: INBOX</text><text x="360" y="118.5" font-size="20" fill="#405b78">Or select another folder</text><path d="M360 136 V174" fill="none" stroke="#456b96" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="180" width="610" height="116" rx="12" fill="#edf4fc" stroke="#6e94bc" stroke-width="2"/><text x="360" y="231" font-size="24" font-weight="700">Processing in SAP</text><text x="360" y="266" font-size="20" fill="#405b78">Retrieve messages and attachments</text><path d="M360 296 V334" fill="none" stroke="#456b96" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="340" width="610" height="116" rx="12" fill="#edf4fc" stroke="#6e94bc" stroke-width="2"/><text x="360" y="378.5" font-size="24" font-weight="700">Destination for successful mail</text><text x="360" y="413.5" font-size="20" fill="#405b78">A different folder in the same account</text><text x="360" y="438.5" font-size="20" fill="#405b78">The name SAP-Processed is optional</text></g></svg>
