<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">Which folder does the mail use?</title>
  <desc id="desc">Which folder does the mail use?. ABAP IMAP Inbound.</desc>
  <rect x="0" y="0" width="1440" height="470" rx="0" fill="#231A28" />
  <rect x="56" y="44" width="30" height="4" rx="2" fill="#D4E86A" />
  <text x="100" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">STEP BY STEP</text>
  <text x="56" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#F4F0E8">Which folder does the mail use?</text>
  <text x="56" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#BDB4C2">Successful processing moves the message to a different folder in the same account.</text>
  <rect x="56.0" y="210" width="426.6666666666667" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="78.0" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">01</text>
  <text x="78.0" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Source folder</text>
  <text x="78.0" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">Default: INBOX</text>
  <rect x="506.6666666666667" y="210" width="426.6666666666667" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="528.6666666666667" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">02</text>
  <text x="528.6666666666667" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Processing in SAP</text>
  <text x="528.6666666666667" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">Retrieve mail + attachments</text>
  <rect x="957.3333333333334" y="210" width="426.6666666666667" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="979.3333333333334" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">03</text>
  <text x="979.3333333333334" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Destination folder</text>
  <text x="979.3333333333334" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">Existing, different folder</text>
  <text x="56" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#BDB4C2">SAP-Processed is an example name. You can choose another existing folder.</text>
  <text x="1234" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">ABAP / IMAP</text>
  <g transform="translate(389.6666666666667 222.0) scale(.8)">
    <path d="M7 17 L19 6 H36 L44 14 H67 V45 L55 54 Z" fill="#76667D" stroke="#F4F0E8" />
    <path d="M4 19 H23 L30 26 H57 V54 H4 Z" fill="#F4F0E8" />
    <path d="M26 39 L34 46 L47 32" fill="none" stroke="#231A28" stroke-width="3" />
  </g>
  <g transform="translate(840.3333333333334 222.0) scale(.8)">
    <path d="M4 14 L57 14 L68 6 L15 6 Z" fill="#BDB4C2" />
    <path d="M57 14 L68 6 L68 43 L57 51 Z" fill="#76667D" />
    <path d="M4 14 H57 V51 H4 Z M4 14 L30 34 L57 14" fill="#F4F0E8" stroke="#231A28" stroke-width="3" />
  </g>
  <g transform="translate(1291.0 222.0) scale(.8)">
    <path d="M7 17 L19 6 H36 L44 14 H67 V45 L55 54 Z" fill="#76667D" stroke="#F4F0E8" />
    <path d="M4 19 H23 L30 26 H57 V54 H4 Z" fill="#F4F0E8" />
    <path d="M26 39 L34 46 L47 32" fill="none" stroke="#231A28" stroke-width="3" />
  </g>
</svg>