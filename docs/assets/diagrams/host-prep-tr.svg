<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">SAP sunucusunu hazırlayın.</title>
  <desc id="desc">SAP sunucusunu hazırlayın.. ABAP IMAP Inbound.</desc>
  <rect x="0" y="0" width="1440" height="470" rx="0" fill="#231A28" />
  <rect x="56" y="44" width="30" height="4" rx="2" fill="#D4E86A" />
  <text x="100" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">ADIM ADIM</text>
  <text x="56" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#F4F0E8">SAP sunucusunu hazırlayın.</text>
  <text x="56" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#BDB4C2">Bu hazırlık SAP GUI bilgisayarında değil, SAP’nin çalıştığı makinede yapılır.</text>
  <rect x="56.0" y="210" width="426.6666666666667" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="78.0" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">01</text>
  <text x="78.0" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Sunucuya erişin</text>
  <text x="78.0" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">Windows veya Linux</text>
  <rect x="506.6666666666667" y="210" width="426.6666666666667" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="528.6666666666667" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">02</text>
  <text x="528.6666666666667" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Araçları hazırlayın</text>
  <text x="528.6666666666667" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">PowerShell + curl</text>
  <rect x="957.3333333333334" y="210" width="426.6666666666667" height="171" rx="14" fill="#302638" stroke="#76667D" stroke-width="1.5" />
  <text x="979.3333333333334" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4E86A">03</text>
  <text x="979.3333333333334" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F0E8">Dosyaları yerleştirin</text>
  <text x="979.3333333333334" y="351" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#BDB4C2">Proje + korumalı klasör</text>
  <text x="56" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#BDB4C2">Kendiniz yetkiliyseniz uygulayın; sunucu başka ekipteyse bu hazırlığı onlarla yapın.</text>
  <text x="1234" y="443" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#BDB4C2">ABAP / IMAP</text>
